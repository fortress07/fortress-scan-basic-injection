<text x='638' y='244' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='13' fill='#d3a4ff' text-anchor='start' font-weight='700'>Báo cáo</text>
<text x='622' y='270' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#e9eef8' text-anchor='start' font-weight='400' opacity='0.92'>console, JSON, SARIF, Markdown</text>
<text x='622' y='292' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10' fill='#a3aec6' text-anchor='start' font-weight='400'>kèm mã thoát cho cổng CI</text>
