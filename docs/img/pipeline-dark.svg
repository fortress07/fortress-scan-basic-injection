<text x='58' y='106' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='13' fill='#ff8585' text-anchor='start' font-weight='700'>Khoá tiến trình</text>
<text x='42' y='132' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#e9eef8' text-anchor='start' font-weight='400' opacity='0.92'>vá đè socket, subprocess, os.system</text>
<text x='42' y='154' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10' fill='#a3aec6' text-anchor='start' font-weight='400'>dù có lỗi cũng không chạy được mã</text>
