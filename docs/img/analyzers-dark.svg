<text x='472' y='130' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='9.5' fill='#a3aec6' text-anchor='start' font-weight='400'>Cách đọc mã</text>
<text x='472' y='147' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#e9eef8' text-anchor='start' font-weight='400' opacity='0.92'>tách token, lexer riêng từng ngôn ngữ</text>
