# Cấu hình cho SonarCloud Automatic Analysis.
#
# VÌ SAO CÓ HAI TỆP CẤU HÌNH:
#
# SonarCloud chạy theo một trong hai chế độ, và mỗi chế độ đọc một tệp khác
# nhau. Bộ quét chạy trong CI ( sonar-scanner ) đọc `sonar-project.properties`;
# Automatic Analysis -- chế độ SonarCloud tự bật khi kho được kết nối mà không
# có bước scanner nào trong CI -- KHÔNG đọc tệp đó, nó đọc tệp này.
#
# Hậu quả của việc chỉ có một tệp đã thấy rõ trên pull request #16: dù
# `sonar-project.properties` khai `sonar.sources=src` và loại trừ `tests/`,
# báo cáo vẫn liệt kê lỗi trong `tests/samples/vulnerable/deploy.ps1` --
# "Remove this use of Invoke-Expression", đúng cái Invoke-Expression được đặt
# ở đó CÓ CHỦ Ý để kiểm thử bộ dò. Giữ hai tệp đồng bộ với nhau là cách duy
# nhất để cùng một phạm vi được áp dụng ở cả hai chế độ.
#
# VÌ SAO LOẠI tests/ KHỎI PHÂN TÍCH:
#
# 1. tests/samples là corpus lỗi CÓ Ý ĐỊNH: command injection, eval, pickle,
#    SQLi, Invoke-Expression, `system("ping $host")`... tất cả tồn tại để kiểm
#    thử hồi quy cho chính bộ dò lỗ hổng này, đúng như mọi công cụ bảo mật
#    khác đều có fixture lỗi riêng. Quét chúng như mã sản phẩm sẽ kéo điểm
#    security xuống và che mất tín hiệu thật ở src/.
#
# 2. tests/ chứa các test sandbox gọi os.system/subprocess.Popen/socket THẬT,
#    trong pytest.raises, để chứng minh chúng bị sandbox chặn. SonarCloud
#    không có ngữ cảnh đó và sẽ sinh hotspot ảo.
#
# Chất lượng của tests/ do chính bộ gate của repo đảm nhiệm: 1105 test pytest
# ( chạy trên 3 OS x 3 phiên bản Python trong CI ) + ruff lint.

sonar.sources=src
sonar.exclusions=**/tests/**,**/.zcode/**
sonar.python.version=3.9,3.11,3.13
