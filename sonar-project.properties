# Cấu hình SonarQube / SonarCloud cho Fortress Scan.
#
# VÌ SAO LOẠI tests/ KHỎI PHÂN TÍCH ( quan trọng - đọc trước khi đổi ):
#
# 1. tests/samples là corpus lỗi CÓ Ý ĐỊNH: toàn bộ lỗ hổng trong đó ( command
#    injection, eval, pickle, SQLi... ) tồn tại để kiểm thử hồi quy cho chính
#    bộ dò lỗ hổng - đúng như mọi công cụ bảo mật khác có fixture lỗi riêng.
#    Quét chúng như mã nguồn thật sẽ kéo điểm security xuống và che mất tín
#    hiệu thật ở src/.
#
# 2. tests/ chứa các test sandbox gọi os.system/subprocess.Popen/socket THẬT -
#    gọi trong pytest.raises để chứng minh chúng bị sandbox chặn. SonarQube
#    không có ngữ cảnh đó và sẽ sinh hotspot/vulnerability ảo.
#
# Chất lượng của tests/ do chính bộ gate của repo đảm nhiệm: 1105 test pytest
# ( chạy trên 3 OS x 3 phiên bản Python trong CI ) + ruff lint.
sonar.projectKey=fortress07_fortress-scan-basic-injection
# Nếu dùng SonarCloud thì bỏ comment và điền đúng organization của anh em:
# sonar.organization=fortress07

sonar.sources=src
sonar.exclusions=**/tests/**,**/.zcode/**

sonar.python.version=3.9,3.11,3.13

# Lưu ý triage cho người duyệt trên SonarQube:
# - src/fortress_scan/security/runtime.py sinh hotspot "OS command / process"
#   vì module đó NHẬP và VÁ CHẶN os.system, subprocess, exec*, spawn* - đây
#   chính là sandbox của công cụ, không có lời gọi nào chạy tiến trình thật.
#   Đánh giá hotspot: Safe.
# - src/fortress_scan/analysis/** chứa tên API nguy hiểm ( "os.system",
#   "eval"... ) dưới dạng CHUỖI trong bảng rule - chúng là dữ liệu của bộ
#   dò, không phải lời gọi.
# - Mọi regex trong src/ đã được ĐO trên 18 hình dạng đầu vào thù địch
#   ( tests/test_regex_complexity.py ) và đều tuyến tính. Nếu SonarQube còn
#   báo S8786/S5852 ở đâu đó, hãy đối chiếu với bài kiểm tra đó trước khi
#   sửa mẫu: nó chạy trên máy thật và bắt lỗi khi thời gian tăng phi tuyến.
