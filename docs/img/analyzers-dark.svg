<line x1='472' y1='242' x2='846' y2='242' stroke='#2b3546' stroke-width='1' stroke-linecap='round' opacity='0.55'/>
<text x='472' y='256' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='9.5' fill='#a3aec6' text-anchor='start' font-weight='400'>Phủ được</text>
<text x='472' y='273' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#e9eef8' text-anchor='start' font-weight='400' opacity='0.92'>dạng nguồn → biến → sink</text>
<line x1='472' y1='284' x2='846' y2='284' stroke='#2b3546' stroke-width='1' stroke-linecap='round' opacity='0.55'/>
<text x='472' y='298' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='9.5' fill='#a3aec6' text-anchor='start' font-weight='400'>Hàm bọc tự viết</text>
<text x='472' y='315' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#e9eef8' text-anchor='start' font-weight='400' opacity='0.92'>chỉ khi nằm cùng hàm</text>
<text x='24' y='362' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#a3aec6' text-anchor='start' font-weight='400'>Không phải cứ nhiều ngôn ngữ là phủ đều: chỗ nào nông hơn thì báo cáo nói ra bằng độ tin cậy thấp hơn.</text>
