a,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#59636e" text-anchor="start">Phủ được</text><text x="550" y="308" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">dạng nguồn → biến → sink</text><line x1="550" y1="320" x2="990" y2="320" stroke="#d1d9e0" stroke-width="1" stroke-linecap="round"/><text x="550" y="334" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#59636e" text-anchor="start">Hàm bọc tự viết</text><text x="550" y="352" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">chỉ khi nằm cùng hàm</text><text x="28" y="404" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#59636e" text-anchor="start">Không phải cứ nhiều ngôn ngữ là phủ đều: chỗ nào nông hơn thì báo cáo nói ra bằng độ tin cậy thấp hơn.</text></svg>
