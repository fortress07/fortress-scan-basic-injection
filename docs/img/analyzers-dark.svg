<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 376' width='900' height='376' role='img'><defs><marker id='adark' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#a3aec6' opacity='0.75'/></marker></defs>
<text x='24' y='30' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='14.5' fill='#e9eef8' text-anchor='start' font-weight='700'>Hai bộ phân tích, hai mức độ sâu</text>
<text x='24' y='52' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#a3aec6' text-anchor='start' font-weight='400'>Giá trị &apos;độ tin cậy&apos; trong báo cáo phản ánh đúng khoảng chênh này.</text>
