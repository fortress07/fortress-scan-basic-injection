e-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">truy vết đường đi</text><text x="48" y="322" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">của dữ liệu</text><text x="48" y="340" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#9198a1" text-anchor="start" opacity="0.95">AST cho Python,</text><text x="48" y="354" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#9198a1" text-anchor="start" opacity="0.95">lexer riêng cho ngôn ngữ khác</text><line x1="350" y1="303.0" x2="365" y2="303.0" stroke="#9198a1" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-dark)"/><rect x="371" y="244" width="318" height="118" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="371" y="244" width="5" height="118" rx="2" fill="#388bfd"/><circle cx="405" cy="274" r="14" fill="#388bfd"/><text x="405" y="279" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="429" y="279" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Lọc</text><text x="391" y="306" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">chỉ thị ignore, ngưỡng mức độ,</text><text x="391" y="322" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">rule bị tắt, baseline</text><text x="391" y="340" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#9198a1" text-anchor="start" opacity="0.95">mọi thứ làm hẹp phạm vi</text><text x="391" y="354" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#9198a1" text-anchor="start" opacity="0.95">đều bị ghi lại và nói ra</text><line x1="693" y1="303.0" x2="708" y2="303.0" stroke="#9198a1" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-dark)"/><rect x="714" y="244" width="318" height="118" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="714" y="244" width="5" height="118" rx="2" fill="#a371f7"/><circle cx="748" cy="274" r="14" fill="#a371f7"/><text x="748" y="279" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="772" y="279" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Báo cáo</text><text x="734" y="306" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">console, JSON,</text><text x="734" y="322" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">SARIF, Markdown</text><text x="734" y="340" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#9198a1" text-anchor="start" opacity="0.95">kèm mã thoát</text><text x="734" y="354" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#9198a1" text-anchor="start" opacity="0.95">cho cổng CI</text><path d="M 873 210 L 873 227 L 187 227 L 187 239" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-dark)"/><text x="28" y="396" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#9198a1" text-anchor="start">Mỗi tệp có ngân sách node/token riêng, nên một tệp dựng riêng để làm treo công cụ sẽ bị cắt chứ không kéo cả lượt quét đi theo.</text></svg>
