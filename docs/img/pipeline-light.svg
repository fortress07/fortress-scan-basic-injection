<text x='24' y='372' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#525d75' text-anchor='start' font-weight='400'>Mỗi tệp có ngân sách node/token riêng, nên một tệp dựng riêng để làm treo công cụ sẽ bị cắt chứ không kéo cả lượt quét đi theo.</text>
