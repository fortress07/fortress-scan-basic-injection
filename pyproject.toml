[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "fortress-scan-basic-injection"
version = "0.1.0"
description = "Công cụ phân tích tĩnh phát hiện sớm các lỗ hổng injection trong mã nguồn."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "fortress07" }]
keywords = [
    "security",
    "sast",
    "static-analysis",
    "taint-analysis",
    "code-injection",
    "rce",
    "sql-injection",
    "command-injection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
fortress-scan = "fortress_scan.cli:main"
fscan = "fortress_scan.cli:main"

[project.urls]
Homepage = "https://github.com/fortress07/fortress-scan-basic-injection"
Source = "https://github.com/fortress07/fortress-scan-basic-injection"
Contact = "mailto:vophuvinh15012007@gmail.com"

[tool.hatch.build.targets.wheel]
packages = ["src/fortress_scan"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Test luôn chạy trên src/ của chính bản sao đang sửa. Thiếu dòng này thì
# `import fortress_scan` rơi vào bản `pip install -e` đang trỏ đi đâu đó,
# và cả bộ test xanh mà không hề chạm vào thay đổi vừa viết.
pythonpath = ["src"]
