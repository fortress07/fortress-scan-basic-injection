<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="412" viewBox="0 0 1040 412" role="img"><defs><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/></marker></defs><rect width="1040" height="412" rx="12" fill="#0d1117"/><rect x="0" y="0" width="1040" height="4" rx="0" fill="#388bfd"/><text x="28" y="42" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start">Sáu bước xảy ra khi anh em gõ lệnh quét</text><text x="28" y="66" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#9198a1" text-anchor="start">Bước 1 là lý do anh em trỏ được công cụ vào mã lạ mà không cần dựng sandbox riêng.</text><rect x="28" y="92" width="318" height="118" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="28" y="92" width="5" height="118" rx="2" fill="#f85149"/><circle cx="62" cy="122" r="14" fill="#f85149"/><text x="62" y="127" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="86" y="127" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Khoá tiến trình</text><text x="48" y="154" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">vá đè socket, subprocess,</text><text x="48" y="170" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">os.system, os.fork</text><text x="48" y="188" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#9198a1" text-anchor="start" opacity="0.95">dù có lỗi cũng không</text><text x="48" y="202" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#9198a1" text-anchor="start" opacity="0.95">chạy được mã, không gọi mạng</text><line x1="350" y1="151.0" x2="365" y2="151.0" stroke="#9198a1" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-dark)"/><rect x="371" y="92" width="318" height="118" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="371" y="92" width="5" height="118" rx="2" fill="#db6d28"/><circle cx="405" cy="122" r="14" fill="#db6d28"/><text x="405" y="127" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="429" y="127" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Tìm tệp</text><text x="391" y="154" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">bỏ thư mục loại trừ, tệp</text><text x="391" y="170" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">nhị phân, tệp quá lớn</text><text x="391" y="188" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#9198a1" text-anchor="start" opacity="0.95">không đi theo liên kết</text><text x="391" y="202" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#9198a1" text-anchor="start" opacity="0.95">trỏ ra ngoài thư mục đích</text><line x1="693" y1="151.0" x2="708" y2="151.0" stroke="#9198a1" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-dark)"/><rect x="714" y="92" width="318" hei